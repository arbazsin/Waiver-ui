<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Waiver Request</title>
  <script src="https://assets.hydrogen.sagittarius.connect.product.adaptavist.com/public/js/bridge.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      padding: 10px 12px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .status-label {
      font-size: 11px;
      color: #6B778C;
      font-weight: 600;
      text-transform: uppercase;
    }

    .status-badge {
      background-color: #DEEBFF;
      color: #0747A6;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 700;
    }

    .waiver-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #0052CC;
      color: #FFFFFF;
      border: none;
      border-radius: 3px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      text-decoration: none;
    }

    .waiver-btn:hover { background-color: #0065FF; }
    .hidden { display: none; }
  </style>
</head>

<body>

  <div id="container"></div>

  <script>
    var ALLOWED_PROJECT    = 'PLC';
    var ALLOWED_ISSUE_TYPE = 'Checklist';
    var WAIVER_ACTION_ID   = 2;

    (function () {

      var container = document.getElementById('container');
      var issueKey  = AdaptavistBridgeContext.context.issueKey;

      if (!issueKey) {
        container.classList.add('hidden');
        return;
      }

      AdaptavistBridge.request({
        url: '/rest/api/2/issue/' + issueKey + '?fields=project,issuetype,status',
        type: 'GET'
      }).then(function (response) {

        var issue      = typeof response === 'string' ? JSON.parse(response) : response;
        var projectKey = issue.fields.project.key;
        var issueType  = issue.fields.issuetype.name;
        var statusName = issue.fields.status.name;
        var issueId    = issue.id;

        if (projectKey !== ALLOWED_PROJECT || issueType !== ALLOWED_ISSUE_TYPE) {
          container.classList.add('hidden');
          return;
        }

        container.innerHTML =
          '<div class="status-row">' +
          '  <span class="status-label">Status:</span>' +
          '  <span class="status-badge">' + statusName + '</span>' +
          '</div>' +
          '<button class="waiver-btn" onclick="openJSPA(' + issueId + ')">Waiver Request</button>';

      }).catch(function () {
        container.classList.add('hidden');
      });

    })();

    // ✅ CLEAN REDIRECT FUNCTION
    function openJSPA(issueId) {
      window.top.location.href =
        '/secure/WorkflowUIDispatcher.jspa?id=' + issueId + '&action=' + WAIVER_ACTION_ID;
    }
  </script>

</body>
</html>
