<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Waiver Request</title>
  <script src="https://assets.hydrogen.sagittarius.connect.product.adaptavist.com/public/js/bridge.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      padding: 10px 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .status-label {
      font-size: 11px;
      color: #6B778C;
      font-weight: 600;
      text-transform: uppercase;
    }
    .waiver-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: #0052CC;
      color: #FFFFFF;
      border: none;
      border-radius: 3px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      justify-content: center;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }
    .waiver-btn:hover { background-color: #0065FF; }
    .waiver-btn:active { background-color: #0747A6; }
    .hidden { display: none; }
    .loading { font-size: 12px; color: #6B778C; }
    .debug-panel {
      margin-top: 12px;
      padding: 8px;
      background: #F4F5F7;
      border: 1px solid #DFE1E6;
      border-radius: 3px;
      font-size: 11px;
      font-family: monospace;
      color: #172B4D;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div id="container"><span class="loading">Loading...</span></div>
  <div id="debug" class="debug-panel"></div>

  <script>
    // ============================================================
    // CONFIGURATION
    // ============================================================
    var ALLOWED_PROJECT    = 'PLC';
    var ALLOWED_ISSUE_TYPE = 'Checklist';
    var WAIVER_ACTION_ID   = 2;

    // ============================================================
    // Debug logger
    // ============================================================
    var debugEl = document.getElementById('debug');
    function log(label, data) {
      var msg = '[WaiverReq] ' + label;
      if (data !== undefined) {
        msg += ': ' + (typeof data === 'object' ? JSON.stringify(data, null, 2) : data);
      }
      console.log(msg);
      debugEl.textContent += msg + '\n';
    }

    // ============================================================
    // Wait for bridge
    // ============================================================
    function waitForBridge(callback) {
      var attempts = 0;
      var maxAttempts = 50;
      var interval = setInterval(function () {
        attempts++;
        var issueKey = null;
        if (window.AdaptavistBridgeContext && window.AdaptavistBridgeContext.context) {
          issueKey = window.AdaptavistBridgeContext.context.issueKey;
        }
        if (attempts === 1 || attempts % 5 === 0 || issueKey) {
          log('Poll #' + attempts, { issueKey: issueKey || 'N/A' });
        }
        if (issueKey) {
          clearInterval(interval);
          callback(issueKey);
        } else if (attempts >= maxAttempts) {
          clearInterval(interval);
          log('FAILED — Bridge never ready');
          document.getElementById('container').innerHTML =
            '<span class="loading">Unable to load issue context.</span>';
        }
      }, 200);
    }

    // ============================================================
    // Main
    // ============================================================
    waitForBridge(function (issueKey) {
      var container = document.getElementById('container');

      log('Bridge ready', issueKey);

      // Step 1: Fetch issue data
      AdaptavistBridge.request({
        url: '/rest/api/2/issue/' + issueKey + '?fields=project,issuetype,status',
        type: 'GET'
      }).then(function (response) {
        var issue = typeof response === 'string' ? JSON.parse(response) : response;

        var projectKey  = issue.fields.project.key;
        var issueType   = issue.fields.issuetype.name;
        var statusName  = issue.fields.status.name;
        var fullIssueKey = issue.key;       // "PLC-18723"
        var issueId     = issue.id;         // numeric

        // Extract Jira base URL from the self link
        // issue.self = "https://your-instance.atlassian.net/rest/api/2/issue/278481"
        var baseUrl = issue.self.split('/rest/')[0];

        log('Parsed', {
          fullIssueKey: fullIssueKey,
          issueId: issueId,
          projectKey: projectKey,
          issueType: issueType,
          status: statusName,
          baseUrl: baseUrl
        });

        // Condition check
        if (projectKey !== ALLOWED_PROJECT || issueType !== ALLOWED_ISSUE_TYPE) {
          log('Condition NOT met — hiding');
          container.classList.add('hidden');
          return;
        }

        log('Condition MET — fetching atl_token');

        // Step 2: Fetch atl_token (XSRF token) from Jira session
        AdaptavistBridge.request({
          url: '/rest/atlassian-connect/1/addons-admin',
          type: 'GET'
        }).then(function () {
          // If that doesn't give us the token, we try the session endpoint
          return AdaptavistBridge.request({
            url: '/rest/auth/1/session',
            type: 'GET'
          });
        }).then(function (sessionResponse) {
          log('Session response', sessionResponse);
        }).catch(function () {
          log('Session endpoint not available — trying without token or alternate method');
        }).finally(function () {
          // Build the URL — try with and without atl_token
          // On Cloud, the user's browser session may handle XSRF via cookies
          var url = baseUrl + '/secure/WorkflowUIDispatcher.jspa?id=' + fullIssueKey + '&action=' + WAIVER_ACTION_ID;

          log('Final transition URL', url);

          container.innerHTML =
            '<div class="status-row">' +
            '  <span class="status-label">Issue:</span>' +
            '  <span>' + fullIssueKey + '</span>' +
            '</div>' +
            '<a href="' + url + '" target="_top" class="waiver-btn">Waiver Request</a>';

          log('Render complete');
        });

      }).catch(function (err) {
        log('REST API FAILED', err);
        container.innerHTML = '<span class="loading">Error: ' + (err.message || err) + '</span>';
      });
    });
  </script>
</body>
</html>
