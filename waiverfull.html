<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Waiver Request</title>

<script src="https://assets.hydrogen.sagittarius.connect.product.adaptavist.com/public/js/bridge.js"></script>

<style>
  body { font-family: Arial; padding: 10px; }
  textarea, select { width: 100%; margin-bottom: 10px; padding: 6px; }

  .btn {
    background:#0052CC;
    color:#fff;
    padding:10px;
    border:none;
    width:100%;
    cursor:pointer;
  }

  .hidden { display:none; }
</style>
</head>

<body>

<div id="container"></div>

<script>
var ALLOWED_PROJECT = 'PLC';
var ALLOWED_ISSUE_TYPE = 'Checklist';

(function () {
  var container = document.getElementById('container');
  var issueKey  = AdaptavistBridgeContext.context.issueKey;

  if (!issueKey) return;

  AdaptavistBridge.request({
    url: '/rest/api/2/issue/' + issueKey + '?fields=project,issuetype,status',
    type: 'GET'
  }).then(function (resp) {

    var issue = typeof resp === 'string' ? JSON.parse(resp) : resp;

    if (
      issue.fields.project.key !== ALLOWED_PROJECT ||
      issue.fields.issuetype.name !== ALLOWED_ISSUE_TYPE
    ) {
      container.classList.add('hidden');
      return;
    }

    // ✅ GET BASE URL
    var baseUrl = issue.self.split('/rest/')[0];

    // ✅ UI
    container.innerHTML = `
      <h3>Waiver Request</h3>

      <label>Waiver</label>
      <select id="waive">
        <option value="Yes">Yes</option>
        <option value="No">No</option>
      </select>

      <label>Response</label>
      <textarea id="response"></textarea>

      <label>Justification</label>
      <textarea id="justification"></textarea>

      <label>Description</label>
      <textarea id="description"></textarea>

      <label>Comment</label>
      <textarea id="comment"></textarea>

      <button class="btn" onclick="submitWaiver('${issue.key}', '${baseUrl}')">
        Submit Waiver
      </button>
    `;
  });
})();


// ==============================
// ✅ MAIN FUNCTION
// ==============================
function submitWaiver(issueKey, baseUrl) {

  var data = {
    waive: document.getElementById("waive").value,
    response: document.getElementById("response").value,
    justification: document.getElementById("justification").value,
    description: document.getElementById("description").value,
    comment: document.getElementById("comment").value
  };

  // ✅ 1. UPDATE ISSUE
  AdaptavistBridge.request({
    url: baseUrl + '/rest/api/2/issue/' + issueKey,
    type: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    data: JSON.stringify({
      fields: {
        customfield_10619: { value: data.waive },
        customfield_10615: data.justification,
        customfield_10382: data.response,
        description: data.description
      }
    })
  })
  .then(function () {

    // ✅ 2. ADD COMMENT
    return AdaptavistBridge.request({
      url: baseUrl + '/rest/api/2/issue/' + issueKey + '/comment',
      type: 'POST',
      headers: { 'Content-Type': 'application/json' },
      data: JSON.stringify({
        body:
          "Waiver: " + data.waive + "\n" +
          "Justification: " + data.justification + "\n" +
          "Response: " + data.response + "\n\n" +
          "Comment:\n" + data.comment
      })
    });
  })
  .then(function () {
    alert("✅ Waiver submitted successfully");
  })
  .catch(function (err) {
    alert("❌ Error: " + JSON.stringify(err));
  });
}

</script>

</body>
</html>
