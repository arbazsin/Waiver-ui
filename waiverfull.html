<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Waiver Request</title>

<script src="https://assets.hydrogen.sagittarius.connect.product.adaptavist.com/public/js/bridge.js"></script>

<style>
  body { font-family: Arial; }

  /* ✅ DIALOG */
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
  }

  .modal-content {
    background: white;
    padding: 15px;
    width: 400px;
    border-radius: 5px;
  }

  textarea, select {
    width: 100%;
    margin-bottom: 10px;
    padding: 6px;
  }

  button {
    background: #0052CC;
    color: white;
    padding: 8px;
    border: none;
    width: 100%;
    cursor: pointer;
  }

  .open-btn {
    margin-top: 20px;
  }
</style>
</head>

<body>

<button class="open-btn" onclick="openDialog()">Open Waiver Request</button>

<!-- ✅ MODAL DIALOG -->
<div id="dialog" class="modal">
  <div class="modal-content">

    <h3>Waiver Request</h3>

    <label>Waiver Request</label>
    <select id="waive">
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>

    <label>Response Details</label>
    <textarea id="response"></textarea>

    <label>Justification</label>
    <textarea id="justification"></textarea>

    <label>Description</label>
    <textarea id="description"></textarea>

    <label>Comment</label>
    <textarea id="comment"></textarea>

    <button onclick="submitWaiver()">Submit</button>
    <button onclick="closeDialog()">Cancel</button>

  </div>
</div>

<script>
var TRANSITION_ID = "2";

var FIELD_IDS = {
  waive: "customfield_10619",
  justification: "customfield_10615",
  response: "customfield_10382"
};

/* ✅ Dialog control */
function openDialog() {
  document.getElementById("dialog").style.display = "flex";
}

function closeDialog() {
  document.getElementById("dialog").style.display = "none";
}

/* ✅ WAIT FOR BRIDGE */
function getIssueKey() {
  if (
    window.AdaptavistBridgeContext &&
    AdaptavistBridgeContext.context &&
    AdaptavistBridgeContext.context.issueKey
  ) {
    return AdaptavistBridgeContext.context.issueKey;
  }
  alert("❌ Issue key not found (Bridge not ready)");
  return null;
}

/* ✅ SUBMIT */
function submitWaiver() {

  var issueKey = getIssueKey();
  if (!issueKey) return;

  var data = {
    waive: document.getElementById("waive").value,
    response: document.getElementById("response").value,
    justification: document.getElementById("justification").value,
    description: document.getElementById("description").value,
    comment: document.getElementById("comment").value
  };

  console.log("Sending Data:", data); // 👈 debug

  AdaptavistBridge.request({
    url: '/rest/api/2/issue/' + issueKey + '/transitions',
    type: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    data: JSON.stringify({
      transition: {
        id: TRANSITION_ID
      },
      fields: {

        // ✅ dropdown
        [FIELD_IDS.waive]: { value: data.waive },

        // ✅ text fields
        [FIELD_IDS.justification]: data.justification,
        [FIELD_IDS.response]: data.response,

        // ✅ description (ADF)
        description: {
          type: "doc",
          version: 1,
          content: [
            {
              type: "paragraph",
              content: [
                {
                  type: "text",
                  text: data.description
                }
              ]
            }
          ]
        }
      },

      // ✅ COMMENT
      update: {
        comment: [
          {
            add: {
              body: data.comment
            }
          }
        ]
      }
    })
  })
  .then(function (res) {
    alert("✅ Success");
    console.log("Response:", res);
    closeDialog();
  })
  .catch(function (err) {
    alert("❌ Error");
    console.log("Error:", err);
  });
}
</script>

</body>
</html>
