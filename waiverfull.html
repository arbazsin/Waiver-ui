<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Waiver Request</title>

<style>
body {
  font-family: Arial, sans-serif;
  padding: 10px;
}

button {
  padding: 8px 14px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

.primary {
  background-color: #0052CC;
  color: white;
}
</style>

</head>

<body>

<!-- ✅ BUTTON ONLY -->
<button class="primary" onclick="openTransition()">
  Waiver Request
</button>

<script>

// ✅ GET ISSUE KEY FROM URL PARAM
function getIssueKey() {
  const params = new URLSearchParams(window.location.search);
  return params.get("issueKey");
}

// ✅ OPEN WORKFLOW SCREEN
function openTransition() {

  const issueKey = getIssueKey();

  if (!issueKey) {
    alert("Issue key missing");
    return;
  }

  const transitionId = "31"; // 🔥 REPLACE THIS WITH YOUR ACTUAL TRANSITION ID

  // ✅ THIS OPENS JIRA POPUP (REAL SCREEN)
  window.location.href = `/browse/${issueKey}?modal=transition&transitionId=${transitionId}`;
}

</script>

</body>
</html>
