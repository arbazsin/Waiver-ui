<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Waiver Request</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      margin: 0;
    }
    .btn {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: #0052CC;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn:hover { background: #0065FF; }
    #debug {
      margin-top: 12px;
      font-size: 11px;
      color: #666;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <button class="btn" id="openTransition">Waiver Request</button>
  <div id="debug"></div>

  <script>
    var TRANSITION_ID = 2;

    function log(msg) {
      var el = document.getElementById('debug');
      el.textContent += msg + '\n';
    }

    // Get issueKey and baseUrl from referrer
    var referrer = document.referrer || '';
    var issueKey = null;
    var baseUrl = null;

    if (referrer) {
      var m = referrer.match(/\/browse\/([A-Z][A-Z0-9_]+-\d+)/) ||
              referrer.match(/selectedIssue=([A-Z][A-Z0-9_]+-\d+)/) ||
              referrer.match(/\/issue\/([A-Z][A-Z0-9_]+-\d+)/);
      if (m) issueKey = m[1];

      var b = referrer.match(/^(https?:\/\/[^\/]+)/);
      if (b) baseUrl = b[1];
    }

    log('issueKey: ' + issueKey);
    log('baseUrl: ' + baseUrl);

    document.getElementById('openTransition').addEventListener('click', function () {
      if (!issueKey || !baseUrl) {
        alert('Could not detect issue. Make sure you are on an issue page.');
        return;
      }

      var url = baseUrl
        + '/secure/WorkflowUIDispatcher.jspa'
        + '?key=' + issueKey
        + '&action=' + TRANSITION_ID
        + '&inline=true'
        + '&decorator=dialog'
        + '&_=' + Date.now();

      log('Opening: ' + url);

      // Open in parent window
      window.top.location.href = url;
    });
  </script>

</body>
</html>
