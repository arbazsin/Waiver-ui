<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Transition</title>
  <script src="https://connect-cdn.atl-paas.net/all.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      margin: 0;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: #0052CC;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn:hover {
      background: #0065FF;
    }
  </style>
</head>
<body>

  <button class="btn" id="openTransition">Open Transition</button>

  <script>
    var TRANSITION_ID = 2;

    document.getElementById('openTransition').addEventListener('click', function () {
      AP.context.getContext(function (context) {
        var issueId = context.jira.issue.id;
        AP.navigator.go('site', {
          absoluteUrl: '/secure/WorkflowUIDispatcher.jspa?id=' + issueId + '&action=' + TRANSITION_ID
        });
      });
    });
  </script>

</body>
</html>
