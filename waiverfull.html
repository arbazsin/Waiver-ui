<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Waiver Request</title>

<style>
body {
  font-family: Arial, sans-serif;
  padding: 10px;
}

h2 {
  margin-bottom: 10px;
}

label {
  display: block;
  margin-top: 12px;
  font-weight: 600;
}

textarea {
  width: 100%;
  min-height: 80px;
  margin-top: 5px;
  padding: 6px;
}

button {
  margin-top: 15px;
  padding: 8px 14px;
  border-radius: 4px;
  border: none;
  cursor: pointer;
}

.primary {
  background-color: #0052CC;
  color: white;
}

.secondary {
  background-color: #ccc;
}
</style>

</head>

<body>

<h2>Waiver Request</h2>

<label>
  <input type="checkbox" id="waive"> Waiver Request
</label>

<label>Response Details</label>
<textarea id="response"></textarea>

<label>Justification</label>
<textarea id="justification"></textarea>

<label>Attachment</label>
<input type="file" id="attachment">

<label>Comment</label>
<textarea id="comment" style="min-height:120px;"></textarea>

<div>
  <button class="primary" onclick="submitForm()">Submit</button>
  <button class="secondary" onclick="resetForm()">Cancel</button>
</div>

<script>

function getIssueKey() {
  const parts = window.location.pathname.split("/");
  return parts[parts.length - 1];
}

function resetForm() {
  document.getElementById("waive").checked = false;
  document.getElementById("response").value = "";
  document.getElementById("justification").value = "";
  document.getElementById("comment").value = "";
}

async function submitForm() {

  const issueKey = getIssueKey();

  const waive = document.getElementById("waive").checked;
  const response = document.getElementById("response").value;
  const justification = document.getElementById("justification").value;
  const comment = document.getElementById("comment").value;

  const fileInput = document.getElementById("attachment");
  const file = fileInput.files[0];

  try {
    // ✅ UPDATE FIELDS
    await fetch(`/rest/api/3/issue/${issueKey}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        fields: {
          customfield_10615: justification,
          customfield_10382: response,
          customfield_10619: waive ? { value: "Yes" } : { value: "No" }
        }
      })
    });

    // ✅ ADD COMMENT
    await fetch(`/rest/api/3/issue/${issueKey}/comment`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        body: `Waiver Request:

Waive: ${waive ? "Yes" : "No"}
Justification: ${justification}
Response: ${response}

Comment: ${comment}`
      })
    });

    // ✅ ATTACHMENT (if file exists)
    if (file) {
      const formData = new FormData();
      formData.append("file", file);

      await fetch(`/rest/api/3/issue/${issueKey}/attachments`, {
        method: "POST",
        headers: {
          "X-Atlassian-Token": "no-check"
        },
        body: formData
      });
    }

    alert("✅ Waiver request submitted!");

  } catch (err) {
    console.error(err);
    alert("❌ Something failed. Check console.");
  }
}

</script>

</body>
</html>
