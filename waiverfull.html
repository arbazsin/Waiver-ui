<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Waiver Request</title>

<script src="https://assets.hydrogen.sagittarius.connect.product.adaptavist.com/public/js/bridge.js"></script>

<style>
  body { font-family: Arial; padding: 10px; }

  /* ✅ DIALOG OVERLAY */
  .overlay {
    position: fixed;
    top:0; left:0;
    width:100%; height:100%;
    background: rgba(0,0,0,0.5);
    display:none;
    justify-content:center;
    align-items:center;
  }

  .dialog {
    background:#fff;
    padding:15px;
    width:400px;
    border-radius:5px;
  }

  textarea, select {
    width:100%;
    margin-bottom:10px;
    padding:6px;
  }

  button {
    background:#0052CC;
    color:white;
    padding:8px;
    border:none;
    width:100%;
    cursor:pointer;
    margin-top:5px;
  }
</style>
</head>

<body>

<button onclick="openDialog()">Open Waiver Request</button>

<!-- ✅ DIALOG -->
<div id="overlay" class="overlay">
  <div class="dialog">

    <h3>Waiver Request</h3>

    <label>Waiver</label>
    <select id="waive">
      <option value="Yes">Yes</option>
      <option value="No">No</option>
    </select>

    <label>Response</label>
    <textarea id="response"></textarea>

    <label>Justification</label>
    <textarea id="justification"></textarea>

    <label>Description</label>
    <textarea id="description"></textarea>

    <label>Comment</label>
    <textarea id="comment"></textarea>

    <button onclick="submitWaiver()">Submit</button>
    <button onclick="closeDialog()">Cancel</button>

  </div>
</div>

<script>
var FIELD_IDS = {
  waive: "customfield_10619",
  justification: "customfield_10615",
  response: "customfield_10382"
};

/* ✅ dialog controls */
function openDialog() {
  document.getElementById("overlay").style.display = "flex";
}
function closeDialog() {
  document.getElementById("overlay").style.display = "none";
}

/* ✅ submit */
function submitWaiver() {

  var issueKey =
    AdaptavistBridgeContext.context.issueKey;

  if (!issueKey) {
    alert("Issue key not found");
    return;
  }

  var data = {
    waive: document.getElementById("waive").value,
    response: document.getElementById("response").value,
    justification: document.getElementById("justification").value,
    description: document.getElementById("description").value,
    comment: document.getElementById("comment").value
  };

  // ✅ 1. UPDATE ISSUE
  AdaptavistBridge.request({
    url: '/rest/api/2/issue/' + issueKey,
    type: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    data: JSON.stringify({
      fields: {
        customfield_10619: { value: data.waive },
        customfield_10615: data.justification,
        customfield_10382: data.response,
        description: data.description
      }
    })
  })

  .then(function () {
    // ✅ 2. ADD COMMENT
    return AdaptavistBridge.request({
      url: '/rest/api/2/issue/' + issueKey + '/comment',
      type: 'POST',
      headers: { 'Content-Type': 'application/json' },
      data: JSON.stringify({
        body:
          "Waiver: " + data.waive + "\n" +
          "Justification: " + data.justification + "\n" +
          "Response: " + data.response + "\n\n" +
          data.comment
      })
    });
  })

  .then(function () {
    alert("✅ Done");
    closeDialog();
  })

  .catch(function (err) {
    alert("❌ " + JSON.stringify(err));
  });
}
</script>

</body>
</html>
