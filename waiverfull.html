<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Waiver Request</title>

<style>
body {
  font-family: Arial, sans-serif;
  padding: 10px;
}

button {
  padding: 8px 14px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}

.primary {
  background-color: #0052CC;
  color: white;
}
</style>

</head>

<body>

<!-- ✅ BUTTON ONLY -->
<button class="primary" onclick="openTransition()">
  Waiver Request
</button>

<script>

// ✅ GET ISSUE KEY FROM URL PARAM
function getIssueKey() {
  const params = new URLSearchParams(window.location.search);
  return params.get("issueKey");
}

// ✅ OPEN WORKFLOW SCREEN
async function openTransition() {

  const issueKey = getIssueKey();

  if (!issueKey) {
    alert("Issue key missing");
    return;
  }

  try {
    // ✅ Step 1: get ISSUE ID
    const res = await fetch(`/rest/api/3/issue/${issueKey}`);
    const data = await res.json();

    const issueId = data.id;

    const transitionId = "2";

    const baseUrl = window.location.origin;

    // ✅ Step 2: open transition popup (REAL one)
    window.top.location.href =
      `${baseUrl}/secure/WorkflowUIDispatcher.jspa?id=${issueId}&action=${transitionId}`;

  } catch (e) {
    console.error(e);
    alert("Failed to open transition");
  }
}


</script>

</body>
</html>
