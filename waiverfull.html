<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Waiver Request</title>

<script src="https://assets.hydrogen.sagittarius.connect.product.adaptavist.com/public/js/bridge.js"></script>

<style>
  body { font-family: Arial; padding: 10px; }
  textarea, select { width: 100%; margin-bottom: 10px; padding: 6px; }
  button {
    background: #0052CC;
    color: white;
    padding: 10px;
    border: none;
    width: 100%;
    cursor: pointer;
  }
</style>
</head>

<body>

<h3>Waiver Request</h3>

<label>Waiver Request</label>
<select id="waive">
  <option value="Yes">Yes</option>
  <option value="No">No</option>
</select>

<label>Response Details</label>
<textarea id="response"></textarea>

<label>Justification</label>
<textarea id="justification"></textarea>

<label>Description</label>
<textarea id="description"></textarea>

<label>Comment</label>
<textarea id="comment"></textarea>

<button onclick="submitWaiver()">Submit</button>

<script>
var TRANSITION_ID = "2";

// ✅ YOUR FIELD IDS
var FIELD_IDS = {
  waive: "customfield_10619",
  justification: "customfield_10615",
  response: "customfield_10382"
};

function getIssueKey() {
  return AdaptavistBridgeContext.context.issueKey;
}

function submitWaiver() {

  var issueKey = getIssueKey();

  var data = {
    waive: document.getElementById("waive").value,
    response: document.getElementById("response").value,
    justification: document.getElementById("justification").value,
    description: document.getElementById("description").value,
    comment: document.getElementById("comment").value
  };

  AdaptavistBridge.request({
    url: '/rest/api/2/issue/' + issueKey + '/transitions',
    type: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    data: JSON.stringify({
      transition: {
        id: TRANSITION_ID
      },

      fields: {
        // ✅ dropdown
        [FIELD_IDS.waive]: { value: data.waive },

        // ✅ text fields
        [FIELD_IDS.justification]: data.justification,
        [FIELD_IDS.response]: data.response,

        // ✅ description (ADF REQUIRED)
        description: {
          type: "doc",
          version: 1,
          content: [
            {
              type: "paragraph",
              content: [
                {
                  type: "text",
                  text: data.description
                }
              ]
            }
          ]
        }
      },

      // ✅ COMMENT
      update: {
        comment: [
          {
            add: {
              body: data.comment
            }
          }
        ]
      }
    })
  })
  .then(function () {
    alert("✅ Waiver submitted");
  })
  .catch(function (err) {
    alert("❌ Error: " + JSON.stringify(err));
  });
}
</script>

</body>
</html>
