<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Waiver Request</title>
  <script src="https://assets.hydrogen.sagittarius.connect.product.adaptavist.com/public/js/bridge.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      padding: 10px 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .status-label {
      font-size: 11px;
      color: #6B778C;
      font-weight: 600;
      text-transform: uppercase;
    }
    .waiver-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: #0052CC;
      color: #FFFFFF;
      border: none;
      border-radius: 3px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      justify-content: center;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }
    .waiver-btn:hover { background-color: #0065FF; }
    .waiver-btn:active { background-color: #0747A6; }
    .hidden { display: none; }
    .loading { font-size: 12px; color: #6B778C; }
  </style>
</head>
<body>
  <div id="container"><span class="loading">Loading...</span></div>
  <script>
    // ============================================================
    // CONFIGURATION
    // ============================================================
    var ALLOWED_PROJECT    = 'PLC';
    var ALLOWED_ISSUE_TYPE = 'Checklist';
    var WAIVER_ACTION_ID   = 2;

    // ============================================================
    // Wait for Adaptavist Bridge to be ready before doing anything
    // ============================================================
    function waitForBridge(callback) {
      var attempts = 0;
      var maxAttempts = 50;  // 50 x 200ms = 10 seconds max wait
      var interval = setInterval(function () {
        attempts++;
        console.log('Bridge check attempt ' + attempts,
          'Bridge:', !!window.AdaptavistBridge,
          'Context:', !!window.AdaptavistBridgeContext,
          'IssueKey:', window.AdaptavistBridgeContext && window.AdaptavistBridgeContext.context
            ? window.AdaptavistBridgeContext.context.issueKey
            : 'N/A'
        );

        if (window.AdaptavistBridgeContext
            && window.AdaptavistBridgeContext.context
            && window.AdaptavistBridgeContext.context.issueKey) {
          clearInterval(interval);
          callback(window.AdaptavistBridgeContext.context.issueKey);
        } else if (attempts >= maxAttempts) {
          clearInterval(interval);
          console.error('Adaptavist Bridge context never became available after ' + maxAttempts + ' attempts');
          document.getElementById('container').innerHTML =
            '<span class="loading">Unable to load issue context.</span>';
        }
      }, 200);
    }

    // ============================================================
    // Main logic — only runs once bridge is ready
    // ============================================================
    waitForBridge(function (issueKey) {
      var container = document.getElementById('container');

      console.log('Bridge ready. Issue key:', issueKey);

      AdaptavistBridge.request({
        url: '/rest/api/2/issue/' + issueKey + '?fields=project,issuetype,status',
        type: 'GET'
      }).then(function (response) {
        var issue      = typeof response === 'string' ? JSON.parse(response) : response;
        var projectKey = issue.fields.project.key;
        var issueType  = issue.fields.issuetype.name;
        var issueId    = issue.id;

        console.log('Project:', projectKey, 'IssueType:', issueType, 'ID:', issueId);

        // Condition: PLC project + Checklist issue type only
        if (projectKey !== ALLOWED_PROJECT || issueType !== ALLOWED_ISSUE_TYPE) {
          console.log('Condition not met — hiding panel');
          container.classList.add('hidden');
          return;
        }

        var url = '/secure/WorkflowUIDispatcher.jspa?id=' + issueId + '&action=' + WAIVER_ACTION_ID;

        container.innerHTML =
          '<div class="status-row">' +
          '  <span class="status-label">Project Key:</span>' +
          '  <span>' + projectKey + '</span>' +
          '</div>' +
          '<a href="' + url + '" class="waiver-btn">Waiver Request</a>';

      }).catch(function (err) {
        console.error('REST API call failed:', err);
        container.innerHTML = '<span class="loading">Error loading issue data.</span>';
      });
    });
  </script>
</body>
</html>
