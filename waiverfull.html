<script>
  // ============================================================
  // CONFIGURATION
  // ============================================================
  var ALLOWED_PROJECT    = 'PLC';
  var ALLOWED_ISSUE_TYPE = 'Checklist';
  var WAIVER_ACTION_ID   = 2;

  // ============================================================
  // UI Logger (NO console.log at all)
  // ============================================================
  var debugEl = document.getElementById('debug');

  function log(label, data, type) {
    type = type || 'info';

    var time = new Date().toLocaleTimeString();

    var color = {
      info: '#0747A6',
      success: '#006644',
      warn: '#BF2600',
      error: '#DE350B'
    }[type] || '#172B4D';

    var entry = document.createElement('div');
    entry.style.marginBottom = '6px';
    entry.style.padding = '6px';
    entry.style.borderRadius = '4px';
    entry.style.background = '#FFFFFF';
    entry.style.borderLeft = '4px solid ' + color;

    var text = '<strong>[' + time + ']</strong> ' + label;

    if (data !== undefined) {
      text += '<br/><span style="color:#42526E;">' +
        (typeof data === 'object'
          ? JSON.stringify(data, null, 2)
          : data) +
        '</span>';
    }

    entry.innerHTML = text;
    debugEl.appendChild(entry);

    // Auto scroll
    debugEl.scrollTop = debugEl.scrollHeight;
  }

  // ============================================================
  // Wait for bridge
  // ============================================================
  function waitForBridge(callback) {
    var attempts = 0;
    var maxAttempts = 50;

    var interval = setInterval(function () {
      attempts++;

      var issueKey = null;
      if (window.AdaptavistBridgeContext && window.AdaptavistBridgeContext.context) {
        issueKey = window.AdaptavistBridgeContext.context.issueKey;
      }

      log('Polling Bridge', { attempt: attempts, issueKey: issueKey });

      if (issueKey) {
        clearInterval(interval);
        log('Bridge READY ✅', issueKey, 'success');
        callback(issueKey);
      } else if (attempts >= maxAttempts) {
        clearInterval(interval);
        log('Bridge FAILED ❌', 'Context not available', 'error');

        document.getElementById('container').innerHTML =
          '<span class="loading">Unable to load issue context.</span>';
      }
    }, 200);
  }

  // ============================================================
  // Token fetching
  // ============================================================
  function getAtlToken(callback) {
    log('Fetching atl_token...');

    AdaptavistBridge.request({
      url: '/rest/api/2/myself',
      type: 'GET'
    }).then(function () {

      if (window.AP && window.AP.cookie) {
        log('Trying AP.cookie...');

        AP.cookie.read('atlassian.xsrf.token', function (token) {
          if (token) {
            log('Token from cookie ✅', token, 'success');
            callback(token);
          } else {
            log('Cookie EMPTY ⚠️', 'Trying scrape...', 'warn');
            scrapeToken(callback);
          }
        });

      } else {
        log('AP.cookie NOT available ⚠️', 'Fallback scrape', 'warn');
        scrapeToken(callback);
      }

    }).catch(function (err) {
      log('Token fetch failed ⚠️', err, 'warn');
      scrapeToken(callback);
    });
  }

  function scrapeToken(callback) {
    log('Scraping token from HTML...');

    AdaptavistBridge.request({
      url: '/secure/Dashboard.jspa',
      type: 'GET',
      dataType: 'html'
    }).then(function (html) {

      var htmlStr = typeof html === 'string' ? html : '';

      log('HTML fetched', { length: htmlStr.length });

      var match =
        htmlStr.match(/atl_token=([a-z0-9_]+)/i) ||
        htmlStr.match(/name="atlassian-token"\s+content="([^"]+)"/);

      if (match) {
        log('Token scraped ✅', match[1], 'success');
        callback(match[1]);
      } else {
        log('Token NOT found ❌', 'Proceeding without token', 'warn');
        callback(null);
      }

    }).catch(function (err) {
      log('Scrape failed ❌', err, 'error');
      callback(null);
    });
  }

  // ============================================================
  // MAIN FLOW
  // ============================================================
  waitForBridge(function (issueKey) {

    var container = document.getElementById('container');

    log('Fetching issue data...', issueKey);

    AdaptavistBridge.request({
      url: '/rest/api/2/issue/' + issueKey + '?fields=project,issuetype,status',
      type: 'GET'
    }).then(function (response) {

      var issue = typeof response === 'string' ? JSON.parse(response) : response;

      var projectKey = issue.fields.project.key;
      var issueType  = issue.fields.issuetype.name;
      var status     = issue.fields.status.name;
      var fullKey    = issue.key;
      var baseUrl    = issue.self.split('/rest/')[0];

      log('Issue parsed ✅', {
        key: fullKey,
        project: projectKey,
        type: issueType,
        status: status,
        baseUrl: baseUrl
      }, 'success');

      // Condition check
      if (projectKey !== ALLOWED_PROJECT || issueType !== ALLOWED_ISSUE_TYPE) {
        log('Conditions NOT met ❌', {
          expectedProject: ALLOWED_PROJECT,
          actualProject: projectKey,
          expectedType: ALLOWED_ISSUE_TYPE,
          actualType: issueType
        }, 'warn');

        container.classList.add('hidden');
        return;
      }

      log('Conditions PASSED ✅', null, 'success');

      getAtlToken(function (atlToken) {

        var url = baseUrl + '/secure/WorkflowUIDispatcher.jspa'
          + '?key=' + encodeURIComponent(fullKey)
          + '&action=' + WAIVER_ACTION_ID;

        if (atlToken) {
          url += '&atl_token=' + encodeURIComponent(atlToken);
        }

        url += '&returnUrl=&inline=true&decorator=dialog&_=' + Date.now();

        log('Final URL ✅', url, 'success');

        container.innerHTML =
          '<div class="status-row">' +
          '<span class="status-label">Issue:</span>' +
          '<span>' + fullKey + '</span>' +
          '</div>' +
          '<a href="' + url + '" target="_top" class="waiver-btn">Waiver Request</a>';

        log('UI rendered ✅', null, 'success');
      });

    }).catch(function (err) {
      log('Issue fetch FAILED ❌', err, 'error');

      container.innerHTML =
        '<span class="loading">Error: ' + (err.message || err) + '</span>';
    });
  });
</script>
