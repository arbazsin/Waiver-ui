<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Waiver Request</title>
  <script src="https://assets.hydrogen.sagittarius.connect.product.adaptavist.com/public/js/bridge.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      padding: 10px 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .status-label {
      font-size: 11px;
      color: #6B778C;
      font-weight: 600;
      text-transform: uppercase;
    }
    .waiver-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: #0052CC;
      color: #FFFFFF;
      border: none;
      border-radius: 3px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      justify-content: center;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }
    .waiver-btn:hover { background-color: #0065FF; }
    .waiver-btn:active { background-color: #0747A6; }
    .hidden { display: none; }
    .loading { font-size: 12px; color: #6B778C; }
    .debug-panel {
      margin-top: 12px;
      padding: 8px;
      background: #F4F5F7;
      border: 1px solid #DFE1E6;
      border-radius: 3px;
      font-size: 11px;
      font-family: monospace;
      color: #172B4D;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div id="container"><span class="loading">Loading...</span></div>
  <div id="debug" class="debug-panel"></div>

  <script>
    // ============================================================
    // CONFIGURATION
    // ============================================================
    var ALLOWED_PROJECT    = 'PLC';
    var ALLOWED_ISSUE_TYPE = 'Checklist';
    var WAIVER_ACTION_ID   = 2;

    // ============================================================
    // Debug logger
    // ============================================================
    var debugEl = document.getElementById('debug');
    function log(label, data) {
      var msg = '[WaiverReq] ' + label;
      if (data !== undefined) {
        msg += ': ' + (typeof data === 'object' ? JSON.stringify(data, null, 2) : data);
      }
      console.log(msg);
      debugEl.textContent += msg + '\n';
    }

    // ============================================================
    // Wait for bridge
    // ============================================================
    function waitForBridge(callback) {
      var attempts = 0;
      var maxAttempts = 50;
      var interval = setInterval(function () {
        attempts++;
        var issueKey = null;
        if (window.AdaptavistBridgeContext && window.AdaptavistBridgeContext.context) {
          issueKey = window.AdaptavistBridgeContext.context.issueKey;
        }
        if (attempts === 1 || attempts % 5 === 0 || issueKey) {
          log('Poll #' + attempts, { issueKey: issueKey || 'N/A' });
        }
        if (issueKey) {
          clearInterval(interval);
          callback(issueKey);
        } else if (attempts >= maxAttempts) {
          clearInterval(interval);
          log('FAILED — Bridge never ready');
          document.getElementById('container').innerHTML =
            '<span class="loading">Unable to load issue context.</span>';
        }
      }, 200);
    }

    // ============================================================
    // Get atl_token (XSRF token)
    // Tries multiple methods since Cloud access varies
    // ============================================================
    function getAtlToken(callback) {
      log('Fetching atl_token...');

      // Method 1: Try fetching any Jira page and extracting token from meta tag
      AdaptavistBridge.request({
        url: '/rest/api/2/myself',
        type: 'GET'
      }).then(function (response) {
        // The token might be in the AP context
        // Try reading it from AP cookie
        if (window.AP && window.AP.cookie) {
          AP.cookie.read('atlassian.xsrf.token', function (token) {
            if (token) {
              log('Got atl_token from AP cookie', token);
              callback(token);
            } else {
              log('AP cookie empty — trying HTML scrape');
              scrapeTokenFromPage(callback);
            }
          });
        } else {
          log('AP.cookie not available — trying HTML scrape');
          scrapeTokenFromPage(callback);
        }
      }).catch(function (err) {
        log('myself endpoint failed', err);
        scrapeTokenFromPage(callback);
      });
    }

    function scrapeTokenFromPage(callback) {
      // Method 2: Fetch the issue page HTML and extract atl_token from it
      AdaptavistBridge.request({
        url: '/secure/Dashboard.jspa',
        type: 'GET',
        dataType: 'html'
      }).then(function (html) {
        var htmlStr = typeof html === 'string' ? html : '';
        log('Dashboard HTML length', htmlStr.length);

        // Look for atl_token in the HTML
        // Pattern: atl_token=XXXXX or name="atl_token" content="XXXXX"
        var tokenMatch = htmlStr.match(/atl_token=([a-f0-9]+_lin)/);
        if (!tokenMatch) {
          tokenMatch = htmlStr.match(/name="atlassian-token"\s+content="([^"]+)"/);
        }
        if (!tokenMatch) {
          tokenMatch = htmlStr.match(/atl_token['":\s]+([a-f0-9_]+lin)/);
        }

        if (tokenMatch && tokenMatch[1]) {
          log('Got atl_token from page scrape', tokenMatch[1]);
          callback(tokenMatch[1]);
        } else {
          log('Could not extract atl_token — will try without it');
          callback(null);
        }
      }).catch(function (err) {
        log('Page scrape failed', err);
        callback(null);
      });
    }

    // ============================================================
    // Main
    // ============================================================
    waitForBridge(function (issueKey) {
      var container = document.getElementById('container');
      log('Bridge ready', issueKey);

      // Step 1: Fetch issue data
      AdaptavistBridge.request({
        url: '/rest/api/2/issue/' + issueKey + '?fields=project,issuetype,status',
        type: 'GET'
      }).then(function (response) {
        var issue = typeof response === 'string' ? JSON.parse(response) : response;

        var projectKey   = issue.fields.project.key;
        var issueType    = issue.fields.issuetype.name;
        var statusName   = issue.fields.status.name;
        var fullIssueKey = issue.key;
        var baseUrl      = issue.self.split('/rest/')[0];

        log('Parsed', {
          fullIssueKey: fullIssueKey,
          projectKey: projectKey,
          issueType: issueType,
          status: statusName,
          baseUrl: baseUrl
        });

        // Condition check
        if (projectKey !== ALLOWED_PROJECT || issueType !== ALLOWED_ISSUE_TYPE) {
          log('Condition NOT met — hiding');
          container.classList.add('hidden');
          return;
        }

        log('Condition MET');

        // Step 2: Get atl_token, then render
        getAtlToken(function (atlToken) {

          // Build the full URL matching the exact format:
          // /secure/WorkflowUIDispatcher.jspa?key=PLC-18723&action=2&atl_token=XXX&returnUrl=&inline=true&decorator=dialog&_=timestamp
          var url = baseUrl + '/secure/WorkflowUIDispatcher.jspa'
            + '?key=' + encodeURIComponent(fullIssueKey)
            + '&action=' + WAIVER_ACTION_ID;

          if (atlToken) {
            url += '&atl_token=' + encodeURIComponent(atlToken);
          }

          url += '&returnUrl='
            + '&inline=true'
            + '&decorator=dialog'
            + '&_=' + Date.now();

          log('Final URL', url);

          container.innerHTML =
            '<div class="status-row">' +
            '  <span class="status-label">Issue:</span>' +
            '  <span>' + fullIssueKey + '</span>' +
            '</div>' +
            '<a href="' + url + '" target="_top" class="waiver-btn">Waiver Request</a>';

          log('Render complete');
        });

      }).catch(function (err) {
        log('REST API FAILED', err);
        container.innerHTML = '<span class="loading">Error: ' + (err.message || err) + '</span>';
      });
    });
  </script>
</body>
</html>
